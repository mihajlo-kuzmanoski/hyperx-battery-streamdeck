[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,0
OnRefreshAction=[!UpdateMeasure MeasureBattery]

[Metadata]
Name=HyperX Battery
Author=NightfurY
Information=Shows HyperX Cloud III Wireless headset battery level via HID polling. Click the skin to refresh; right-click for the standard Rainmeter context menu.
Version=1.0.0
License=MIT

[Variables]
Width=200
Height=82
ColorHigh=74,222,128,255
ColorMid=251,191,36,255
ColorLow=239,68,68,255
ColorOff=160,160,160,255
ColorBG=18,18,22,220
ColorBorder=40,40,48,255
ColorHeader=170,170,180,255

; --------------------------------------------------
; Measures
; --------------------------------------------------

[MeasureBattery]
Measure=Plugin
Plugin=RunCommand
Program=#@#HyperXBattery-cli.exe
StartInFolder=#@#
OutputType=ANSI
Timeout=5000
UpdateDivider=60
FinishAction=[!UpdateMeasure MeasureValue][!UpdateMeasure MeasureNum][!UpdateMeter *][!Redraw]
State=Hide

[MeasureValue]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"--","^(\d+)$":"\1%","^$":""
DynamicVariables=1
UpdateDivider=-1

[MeasureStatus]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"Disconnected","^(\d+)$":"Connected","^$":"Reading..."
DynamicVariables=1
UpdateDivider=-1

[MeasureNum]
Measure=Calc
Formula=([MeasureBattery] >= 0 && [MeasureBattery] <= 100 ? [MeasureBattery] : -1)
DynamicVariables=1
UpdateDivider=-1
IfCondition=(MeasureNum > 50)
IfTrueAction=[!SetOption MeterValue FontColor "#ColorHigh#"][!Redraw]
IfCondition2=(MeasureNum > 20) && (MeasureNum <= 50)
IfTrueAction2=[!SetOption MeterValue FontColor "#ColorMid#"][!Redraw]
IfCondition3=(MeasureNum >= 0) && (MeasureNum <= 20)
IfTrueAction3=[!SetOption MeterValue FontColor "#ColorLow#"][!Redraw]
IfCondition4=(MeasureNum < 0)
IfTrueAction4=[!SetOption MeterValue FontColor "#ColorOff#"][!Redraw]
IfConditionMode=1

; --------------------------------------------------
; Meters
; --------------------------------------------------

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,#Width#,#Height#,12 | Fill Color #ColorBG# | StrokeWidth 1 | Stroke Color #ColorBorder#
LeftMouseUpAction=[!UpdateMeasure MeasureBattery]
MouseActionCursor=1
ToolTipText=Click to refresh

[MeterHeader]
Meter=String
Text=HYPERX BATTERY
X=14
Y=10
FontFace=Segoe UI
FontSize=9
FontColor=#ColorHeader#
StringStyle=Bold
AntiAlias=1

[MeterValue]
Meter=String
MeasureName=MeasureValue
X=(#Width#/2)
Y=26
StringAlign=CenterTop
FontFace=Arial Black
FontSize=22
FontColor=#ColorOff#
StringStyle=Bold
AntiAlias=1

[MeterStatus]
Meter=String
MeasureName=MeasureStatus
X=(#Width#/2)
Y=(#Height#-16)
StringAlign=CenterTop
FontFace=Segoe UI
FontSize=8
FontColor=120,120,130,255
AntiAlias=1
