[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=HyperX Battery
Author=NightfurY
Information=Shows HyperX Cloud III Wireless headset battery level via HID polling.
Version=1.0.0
License=MIT

[Variables]
ColorHigh=74,222,128,255
ColorMid=251,191,36,255
ColorLow=239,68,68,255
ColorOff=160,160,160,255
ColorBG=18,18,22,220
ColorHeader=170,170,180,255
ColorStatus=120,120,130,255

[MeasureBattery]
Measure=Plugin
Plugin=RunCommand
Program=#@#HyperXBattery-cli.exe
StartInFolder=#@#
OutputType=ANSI
Timeout=5000
UpdateDivider=60
FinishAction=[!UpdateMeasure MeasureLevel][!UpdateMeasure MeasureValue][!UpdateMeasure MeasureStatus][!UpdateMeter *][!Redraw]
State=Hide

[MeasureLevel]
Measure=String
String=[MeasureBattery]
DynamicVariables=1
IfMatch=^([6-9][0-9]|100)$
IfMatchAction=[!SetOption MeterValue FontColor "#ColorHigh#"][!Redraw]
IfMatch2=^([2-4][0-9]|50)$
IfMatchAction2=[!SetOption MeterValue FontColor "#ColorMid#"][!Redraw]
IfMatch3=^([0-9]|1[0-9]|20)$
IfMatchAction3=[!SetOption MeterValue FontColor "#ColorLow#"][!Redraw]
IfMatch4=^DISCONNECTED$
IfMatchAction4=[!SetOption MeterValue FontColor "#ColorOff#"][!Redraw]
IfMatchMode=1

[MeasureValue]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"--","^(\d+)$":"\1%","^$":"..."
DynamicVariables=1

[MeasureStatus]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"Disconnected","^(\d+)$":"Connected","^$":"Reading..."
DynamicVariables=1

[MeterBG]
Meter=Image
X=0
Y=0
W=200
H=82
SolidColor=#ColorBG#
LeftMouseUpAction=[!CommandMeasure MeasureBattery "Run"]
MouseActionCursor=1
ToolTipText=Click to refresh

[MeterHeader]
Meter=String
Text=HYPERX BATTERY
X=100
Y=10
StringAlign=CenterTop
FontFace=Segoe UI
FontSize=9
FontColor=#ColorHeader#
StringStyle=Bold
AntiAlias=1

[MeterValue]
Meter=String
MeasureName=MeasureValue
X=100
Y=24
StringAlign=CenterTop
FontFace=Arial Black
FontSize=22
FontColor=#ColorOff#
StringStyle=Bold
AntiAlias=1

[MeterStatus]
Meter=String
MeasureName=MeasureStatus
X=100
Y=62
StringAlign=CenterTop
FontFace=Segoe UI
FontSize=8
FontColor=#ColorStatus#
AntiAlias=1
