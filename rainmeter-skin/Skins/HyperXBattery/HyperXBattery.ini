[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=HyperX Battery
Author=NightfurY
Information=Shows HyperX Cloud III Wireless headset battery level via HID polling. Mond-inspired rounded panel.
Version=1.3.0
License=MIT

[Variables]
ColorHigh=80,255,140,255
ColorMid=255,200,60,255
ColorLow=255,60,80,255
ColorOff=120,120,130,255
ColorWhite=235,235,245,255
ColorLabel=180,180,190,255
ColorMuted=130,130,140,255
ColorBG=8,8,12,250
ColorBarBG=30,30,38,180
ColorDivider=255,40,70,140
BarColor=80,255,140,255

[MeasureBattery]
Measure=Plugin
Plugin=RunCommand
Program=#@#HyperXBattery-cli.exe
StartInFolder=#@#
OutputType=ANSI
Timeout=5000
UpdateDivider=60
FinishAction=[!UpdateMeasure MeasureLevel][!UpdateMeasure MeasureValue][!UpdateMeasure MeasureBarPercent][!UpdateMeasure MeasureStatus][!UpdateMeter *][!Redraw]
State=Hide

[MeasureLevel]
Measure=String
String=[MeasureBattery]
DynamicVariables=1
IfMatch=^([6-9][0-9]|100)$
IfMatchAction=[!SetVariable BarColor "#ColorHigh#"][!SetOption MeterValue FontColor "#ColorWhite#"][!UpdateMeter *][!Redraw]
IfMatch2=^([2-4][0-9]|50)$
IfMatchAction2=[!SetVariable BarColor "#ColorMid#"][!SetOption MeterValue FontColor "#ColorWhite#"][!UpdateMeter *][!Redraw]
IfMatch3=^([0-9]|1[0-9]|20)$
IfMatchAction3=[!SetVariable BarColor "#ColorLow#"][!SetOption MeterValue FontColor "#ColorWhite#"][!UpdateMeter *][!Redraw]
IfMatch4=^DISCONNECTED$
IfMatchAction4=[!SetVariable BarColor "#ColorOff#"][!SetOption MeterValue FontColor "#ColorOff#"][!UpdateMeter *][!Redraw]
IfMatchMode=1

[MeasureValue]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"--","^(\d+)$":"\1%","^$":"--"
DynamicVariables=1

[MeasureBarPercent]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"0","^$":"0"
DynamicVariables=1
MinValue=0
MaxValue=100

[MeasureStatus]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"Disconnected","^(\d+)$":"Cloud III Wireless","^$":"Polling..."
DynamicVariables=1

; ============ METERS ============

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,320,110,14 | Fill Color #ColorBG# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureBattery "Run"]
MouseActionCursor=1
ToolTipText=Click to refresh HyperX battery

[MeterBanner]
Meter=Image
ImageName=#@#hyperx-hx.png
X=10
Y=15
W=90
H=80
PreserveAspectRatio=1

[MeterDivider]
Meter=Shape
Shape=Rectangle 108,18,1,74,0 | Fill Color #ColorDivider# | StrokeWidth 0

[MeterLabel]
Meter=String
Text=HYPERX BATTERY
X=120
Y=18
FontFace=Segoe UI
FontSize=9
FontColor=#ColorLabel#
StringStyle=Bold
AntiAlias=1

[MeterValue]
Meter=String
MeasureName=MeasureValue
X=306
Y=12
StringAlign=Right
FontFace=Segoe UI
FontSize=22
FontColor=#ColorWhite#
StringStyle=Bold
AntiAlias=1

[MeterStatus]
Meter=String
MeasureName=MeasureStatus
X=120
Y=50
FontFace=Segoe UI
FontSize=8
FontColor=#ColorMuted#
AntiAlias=1

[MeterBarFrame]
Meter=Shape
Shape=Rectangle 120,76,184,6,3 | Fill Color #ColorBarBG# | StrokeWidth 0

[MeterBarFill]
Meter=Shape
Shape=Rectangle 120,76,(Clamp(Round([MeasureBarPercent]*184/100),0,184)),6,3 | Fill Color #BarColor# | StrokeWidth 0
DynamicVariables=1
