[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=HyperX Battery
Author=NightfurY
Information=Shows HyperX Cloud III Wireless headset battery level via HID polling. Scroll on the skin to resize, middle-click to reset.
Version=1.4.0
License=MIT

[Variables]
Scale=1.0
ColorHigh=80,255,140,255
ColorMid=255,200,60,255
ColorLow=255,60,80,255
ColorOff=120,120,130,255
ColorWhite=235,235,245,255
ColorLabel=180,180,190,255
ColorMuted=130,130,140,255
ColorBG=8,8,12,250
ColorBarBG=30,30,38,180
ColorDivider=255,40,70,140
BarColor=80,255,140,255

[MeasureBattery]
Measure=Plugin
Plugin=RunCommand
Program=#@#HyperXBattery-cli.exe
StartInFolder=#@#
OutputType=ANSI
Timeout=5000
UpdateDivider=60
FinishAction=[!UpdateMeasure MeasureLevel][!UpdateMeasure MeasureValue][!UpdateMeasure MeasureBarPercent][!UpdateMeasure MeasureStatus][!UpdateMeter *][!Redraw]
State=Hide

[MeasureLevel]
Measure=String
String=[MeasureBattery]
DynamicVariables=1
IfMatch=^([6-9][0-9]|100)$
IfMatchAction=[!SetVariable BarColor "#ColorHigh#"][!SetOption MeterValue FontColor "#ColorWhite#"][!UpdateMeter *][!Redraw]
IfMatch2=^([2-4][0-9]|50)$
IfMatchAction2=[!SetVariable BarColor "#ColorMid#"][!SetOption MeterValue FontColor "#ColorWhite#"][!UpdateMeter *][!Redraw]
IfMatch3=^([0-9]|1[0-9]|20)$
IfMatchAction3=[!SetVariable BarColor "#ColorLow#"][!SetOption MeterValue FontColor "#ColorWhite#"][!UpdateMeter *][!Redraw]
IfMatch4=^DISCONNECTED$
IfMatchAction4=[!SetVariable BarColor "#ColorOff#"][!SetOption MeterValue FontColor "#ColorOff#"][!UpdateMeter *][!Redraw]
IfMatchMode=1

[MeasureValue]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"--","^(\d+)$":"\1%","^$":"--"
DynamicVariables=1

[MeasureBarPercent]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"0","^$":"0"
DynamicVariables=1
MinValue=0
MaxValue=100

[MeasureStatus]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"Disconnected","^(\d+)$":"Cloud III Wireless","^$":"Polling..."
DynamicVariables=1

; ============ METERS ============

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,(320*#Scale#),(110*#Scale#),(14*#Scale#) | Fill Color #ColorBG# | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureBattery "Run"]
MouseScrollUpAction=[!SetVariable Scale "(Clamp((#Scale#+0.1),0.5,3.0))"][!UpdateMeter *][!Redraw][!WriteKeyValue Variables Scale "[#Scale#]" "#CURRENTFILE#"]
MouseScrollDownAction=[!SetVariable Scale "(Clamp((#Scale#-0.1),0.5,3.0))"][!UpdateMeter *][!Redraw][!WriteKeyValue Variables Scale "[#Scale#]" "#CURRENTFILE#"]
MiddleMouseUpAction=[!SetVariable Scale "1.0"][!UpdateMeter *][!Redraw][!WriteKeyValue Variables Scale "1.0" "#CURRENTFILE#"]
MouseActionCursor=1
ToolTipText=Click to refresh | Scroll to resize | Middle-click to reset size

[MeterBanner]
Meter=Image
ImageName=#@#hyperx-hx.png
X=(10*#Scale#)
Y=(15*#Scale#)
W=(90*#Scale#)
H=(80*#Scale#)
PreserveAspectRatio=1
DynamicVariables=1

[MeterDivider]
Meter=Shape
Shape=Rectangle (108*#Scale#),(18*#Scale#),(1*#Scale#),(74*#Scale#),0 | Fill Color #ColorDivider# | StrokeWidth 0
DynamicVariables=1

[MeterLabel]
Meter=String
Text=HYPERX BATTERY
X=(120*#Scale#)
Y=(18*#Scale#)
FontFace=Segoe UI
FontSize=(9*#Scale#)
FontColor=#ColorLabel#
StringStyle=Bold
AntiAlias=1
DynamicVariables=1

[MeterValue]
Meter=String
MeasureName=MeasureValue
X=(306*#Scale#)
Y=(12*#Scale#)
StringAlign=Right
FontFace=Segoe UI
FontSize=(22*#Scale#)
FontColor=#ColorWhite#
StringStyle=Bold
AntiAlias=1
DynamicVariables=1

[MeterStatus]
Meter=String
MeasureName=MeasureStatus
X=(120*#Scale#)
Y=(50*#Scale#)
FontFace=Segoe UI
FontSize=(8*#Scale#)
FontColor=#ColorMuted#
AntiAlias=1
DynamicVariables=1

[MeterBarFrame]
Meter=Shape
Shape=Rectangle (120*#Scale#),(76*#Scale#),(184*#Scale#),(6*#Scale#),(3*#Scale#) | Fill Color #ColorBarBG# | StrokeWidth 0
DynamicVariables=1

[MeterBarFill]
Meter=Shape
Shape=Rectangle (120*#Scale#),(76*#Scale#),(Clamp(Round([MeasureBarPercent]*184/100),0,184)*#Scale#),(6*#Scale#),(3*#Scale#) | Fill Color #BarColor# | StrokeWidth 0
DynamicVariables=1
