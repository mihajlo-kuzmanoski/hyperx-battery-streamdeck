[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=HyperX Battery
Author=NightfurY
Information=Shows HyperX Cloud III Wireless headset battery level via HID polling. Side-banner style.
Version=1.2.1
License=MIT

[Variables]
ColorHigh=80,255,140,255
ColorMid=255,200,60,255
ColorLow=255,60,80,255
ColorOff=160,160,170,255
ColorWhite=245,245,255,255
ColorRedNeon=255,40,70,255
ColorHeader=220,220,230,230
ColorBG=12,12,16,235
ColorBarBG=30,30,38,200
ColorDivider=255,40,70,180

[MeasureBattery]
Measure=Plugin
Plugin=RunCommand
Program=#@#HyperXBattery-cli.exe
StartInFolder=#@#
OutputType=ANSI
Timeout=5000
UpdateDivider=60
FinishAction=[!UpdateMeasure MeasureLevel][!UpdateMeasure MeasureValue][!UpdateMeasure MeasureBarPercent][!UpdateMeter *][!Redraw]
State=Hide

[MeasureLevel]
Measure=String
String=[MeasureBattery]
DynamicVariables=1
IfMatch=^([6-9][0-9]|100)$
IfMatchAction=[!SetOption MeterValue FontColor "#ColorWhite#"][!SetOption MeterValue FontEffectColor "0,255,120,160"][!SetOption MeterBar BarColor "#ColorHigh#"][!Redraw]
IfMatch2=^([2-4][0-9]|50)$
IfMatchAction2=[!SetOption MeterValue FontColor "#ColorWhite#"][!SetOption MeterValue FontEffectColor "255,160,40,160"][!SetOption MeterBar BarColor "#ColorMid#"][!Redraw]
IfMatch3=^([0-9]|1[0-9]|20)$
IfMatchAction3=[!SetOption MeterValue FontColor "#ColorWhite#"][!SetOption MeterValue FontEffectColor "255,30,60,220"][!SetOption MeterBar BarColor "#ColorLow#"][!Redraw]
IfMatch4=^DISCONNECTED$
IfMatchAction4=[!SetOption MeterValue FontColor "#ColorOff#"][!SetOption MeterValue FontEffectColor "0,0,0,0"][!SetOption MeterBar BarColor "#ColorOff#"][!Redraw]
IfMatchMode=1

[MeasureValue]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"--","^(\d+)$":"\1%","^$":"..."
DynamicVariables=1

[MeasureBarPercent]
Measure=String
String=[MeasureBattery]
RegExpSubstitute=1
Substitute="^DISCONNECTED.*$":"0","^$":"0"
DynamicVariables=1
MinValue=0
MaxValue=100

[MeterBG]
Meter=Image
X=0
Y=0
W=320
H=130
SolidColor=#ColorBG#
LeftMouseUpAction=[!CommandMeasure MeasureBattery "Run"]
MouseActionCursor=1
ToolTipText=Click to refresh HyperX battery

[MeterBanner]
Meter=Image
ImageName=#@#hyperx-hx.png
X=5
Y=20
W=100
H=90
PreserveAspectRatio=1

[MeterDivider]
Meter=Image
X=110
Y=12
W=1
H=106
SolidColor=#ColorDivider#

[MeterHeader]
Meter=String
Text=HYPERX BATTERY
X=215
Y=16
StringAlign=CenterTop
FontFace=Segoe UI
FontSize=10
FontColor=#ColorHeader#
StringStyle=Bold
AntiAlias=1

[MeterValue]
Meter=String
MeasureName=MeasureValue
X=215
Y=34
StringAlign=CenterTop
FontFace=Arial Black
FontSize=32
FontColor=#ColorWhite#
StringStyle=Bold
AntiAlias=1
StringEffect=Shadow
FontEffectColor=255,40,70,160

[MeterBarFrame]
Meter=Image
X=122
Y=98
W=188
H=18
SolidColor=#ColorBarBG#

[MeterBar]
Meter=Bar
MeasureName=MeasureBarPercent
X=124
Y=100
W=184
H=14
BarColor=#ColorHigh#
BarOrientation=Horizontal
SolidColor=0,0,0,0
